name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v4

      - name: Fetch vendored grammars
        run: ./scripts/update-grammars.sh

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (production code)
        run: cargo clippy --workspace --lib --bins -- -D warnings

      - name: Run clippy (tests)
        run: cargo clippy --workspace --tests -- -A clippy::too_many_lines -D warnings

      - name: Run cccc complexity gate
        uses: moznion/cccc-action@v1
        with:
          path: .
          top-cognitive: 15
          args: --lang rust

  coverage-crap:
    name: Coverage & CRAP Metric
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v4

      - name: Fetch vendored grammars
        run: ./scripts/update-grammars.sh

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov, cargo-nextest & cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest,cargo-binstall

      - name: Install cargo-crap
        run: |
          cargo binstall --no-confirm --force cargo-crap@0.5.0
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo crap --version

      - name: Run doc tests
        run: cargo test --workspace --doc

      - name: Generate test coverage trace
        id: coverage
        run: make coverage

      - name: Emit GitHub PR annotations
        if: always() && steps.coverage.outcome == 'success'
        run: cargo crap --path . --lcov target/lcov.info --format github

      - name: Publish CRAP summary to Step Summary
        if: always() && steps.coverage.outcome == 'success'
        run: cargo crap --path . --lcov target/lcov.info --threshold 30 --format markdown >> $GITHUB_STEP_SUMMARY

      - name: Gate on CRAP threshold
        run: cargo crap --path . --lcov target/lcov.info --threshold 30 --fail-above

  validate-parity:
    name: Parity Validation
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch vendored grammars
        run: ./scripts/update-grammars.sh

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install latest upstream ripwire binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.local/bin"
          gh release download --repo redhat-et/ripwire --pattern '*-linux-x64.tar.gz' -O - | tar -xz --strip-components=1 -C "$HOME/.local/bin" --wildcards '*/ripwire'
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          "$HOME/.local/bin/ripwire" -v
      - name: Run 1:1 Parity Validation Matrix
        run: make validate
