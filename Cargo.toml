[package]
name = "rwire"
version = "0.1.0"
edition = "2021"
authors = ["Cason Adams"]
description = "High-throughput agent context router and deterministic static analysis engine"
readme = "README.md"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
ignore = "0.4"
lasso = { version = "0.7", features = ["multi-threaded", "serialize"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
