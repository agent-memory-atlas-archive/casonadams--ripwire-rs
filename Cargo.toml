[package]
name = "rwire"
version = "0.1.0"
edition = "2021"
authors = ["Cason Adams"]
description = "High-throughput agent context router and deterministic static analysis engine"
readme = "README.md"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
ignore = "0.4"
lasso = { version = "0.7", features = ["multi-threaded", "serialize"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
streaming-iterator = "0.1"
tree-sitter = "0.25"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3.27.0"
